[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tooling"
version = "3.0.0"
description = "Local multi-client AI tooling, MCP, plugin, and skill profile manager (OpenCode V2, OpenChamber, Codex, Claude Desktop/Code, Antigravity)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
agent-tooling = "agent_tooling.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
